<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Conheça os detalhes, dimensões e inspirações das peças da curadoria HS." />
  <title>HS | Detalhes do Acervo</title>
  <link rel="canonical" href="https://hsmobilia.com.br/produto.html" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="HS" />
  <meta property="og:title" content="HS | Detalhes do Acervo" />
  <meta property="og:description" content="Conheça os detalhes, dimensões e inspirações das peças da curadoria HS." />
  <meta property="og:url" content="https://hsmobilia.com.br/produto.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" />
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./acervo.css" />
  <link rel="stylesheet" href="./produto.css" />
  <script type="module" src="produto.js?v=2" defer></script>
  <script type="module" src="./ui.js" defer></script>
</head>

<body data-page="acervo">

  <div data-site-header></div>

  <main class="container" style="padding-top: 4rem; padding-bottom: 8rem;">
    <!-- Aqui vai entrar a foto principal e os dados (Título, Dimensão, Downloads) -->
    <div id="product-container">
      <p style="text-align: center; color: var(--color-text-light); letter-spacing: 2px;">Carregando detalhes...</p>
    </div>

    <!-- SEÇÃO DA GALERIA -->
    <section class="gallery-section">
      <div style="text-align: center; margin-bottom: 3rem;">
        <span
          style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: var(--color-accent); display: block; margin-bottom: 1rem;">Inspiração</span>
        <h3 style="font-family: var(--font-secondary); font-size: 2rem; font-weight: 400; margin: 0;">Galeria e Detalhes
        </h3>
      </div>

      <!-- Grade da Galeria -->
      <div id="product-gallery"
        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
        <!-- JS vai injetar as fotos adicionais aqui -->
      </div>
    </section>

    <!-- SEÇÃO DE PRODUTOS RELACIONADOS -->
    <section id="related-section" style="margin-top: 8rem; display: none;">
      <div style="text-align: center; margin-bottom: 3rem;">
        <span
          style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: var(--color-accent); display: block; margin-bottom: 1rem;">Continue
          Explorando</span>
        <h3 style="font-family: var(--font-secondary); font-size: 2rem; font-weight: 400; margin: 0;">Peças Relacionadas
        </h3>
      </div>

      <!-- Reutilizando a classe sierra-grid do acervo para manter o padrão -->
      <div id="related-products-grid" class="sierra-grid">
        <!-- JS injeta as peças aqui -->
      </div>
    </section>

  </main>

  <div data-site-footer></div>

</body>

</html>

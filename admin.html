<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel administrativo da HS para gestão do acervo, blog e publicações do showroom." />
  <meta name="robots" content="noindex,nofollow" />
  <title>HS | Gestão de Acervo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" />
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js" defer></script>

  <script type="module" src="./admin.js" defer></script>
  <script type="module" src="./ui.js" defer></script>
</head>

<body data-page="admin">

  <div data-site-header></div>

  <main id="conteudo" class="container" style="padding-bottom: 8rem; padding-top: 10rem;">

    <section id="admin-login-shell" style="max-width: 400px; margin: 10vh auto; text-align: center;">
      <div class="section-title">
        <span>Acesso Restrito</span>
        <h2>Curadoria</h2>
      </div>
      <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 2rem; margin-top: 2rem;">
        <div class="input-group">
          <label for="admin-email">E-mail de Administrador</label>
          <input type="email" id="admin-email" autocomplete="email" required />
        </div>
        <div class="input-group">
          <label for="admin-password">Senha</label>
          <input type="password" id="admin-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-dark">Acessar Painel</button>
      </form>
    </section>

    <section id="admin-shell" class="hidden">

      <div
        style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border); padding-bottom: 2rem; margin-bottom: 2rem;">
        <div class="section-title" style="margin-bottom: 0; text-align: left;">
          <span>Backoffice</span>
          <h2 style="margin-bottom: 0;">Painel de Controle</h2>
        </div>
        <button id="admin-logout-btn" class="btn" style="border-color: #d9534f; color: #d9534f;">Sair do Painel</button>
      </div>

      <div class="admin-tabs">
        <button id="btn-tab-acervo" class="tab-btn active" type="button" data-tab="acervo">Acervo de Peças</button>
        <button id="btn-tab-blog" class="tab-btn" type="button" data-tab="blog">Publicações do Blog</button>
      </div>

      <section id="modulo-acervo" style="display: grid; gap: 4rem; margin-top: 3rem;">

        <div id="admin-feedback" style="text-align:center; font-size: 0.8rem; letter-spacing: 2px;"></div>

        <div class="admin-main-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start;">

          <div style="background: #F9F9F9; padding: 3rem; border: 1px solid var(--color-border);">
            <h3 style="font-family: var(--font-secondary); font-size: 1.5rem; margin-bottom: 2rem; font-weight: 400;">
              Adicionar Peça</h3>
            <form id="product-form" style="display: flex; flex-direction: column; gap: 1.5rem;">

              <input type="hidden" id="edit-product-id" value="">

              <div class="input-group">
                <label for="product-name">Nome da Peça</label>
                <input type="text" id="product-name" name="name" required />
              </div>

              <div class="input-group">
                <label for="product-brand">Marca / Designer</label>
                <input type="text" id="product-brand" name="brand" required />
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="input-group">
                  <label for="product-category">Categoria</label>
                  <input type="text" id="product-category" name="category" placeholder="Ex: Sofás" />
                </div>
                <div class="input-group">
                  <label for="product-dimensions">Dimensões</label>
                  <input type="text" id="product-dimensions" name="dimensions" placeholder="Ex: 200x90x80" />
                </div>
              </div>

              <div class="input-group">
                <label for="product-description">Descrição</label>
                <textarea id="product-description" name="description" rows="3"
                  style="width: 100%; border: none; border-bottom: 1px solid var(--color-border); background: transparent; font-family: var(--font-primary); font-size: 0.85rem; padding: 0.5rem 0; resize: vertical;"></textarea>
              </div>

              <div class="input-group">
                <label for="product-image">URL da Imagem (Alta Qualidade)</label>
                <input type="url" id="product-image" name="image_url" required />
              </div>

              <div class="input-group">
                <label for="product-file-2d">Caminho privado ou URL legada do arquivo 2D</label>
                <input type="text" id="product-file-2d" name="file_2d_url" />
              </div>

              <div class="input-group">
                <label for="product-file-3d">Caminho privado ou URL legada do arquivo 3D</label>
                <input type="text" id="product-file-3d" name="file_3d_url" />
              </div>

              <button type="submit" id="btn-submit" class="btn btn-dark" style="margin-top: 1rem;">Salvar no
                Acervo</button>
            </form>
          </div>

          <div style="display: flex; flex-direction: column; gap: 4rem;">

            <div style="background: #F9F9F9; padding: 3rem; border: 1px solid var(--color-border);">
              <h3 style="font-family: var(--font-secondary); font-size: 1.5rem; margin-bottom: 1rem; font-weight: 400;">
                Importar Lote (CSV)</h3>
              <p style="font-size: 0.8rem; color: var(--color-text-light); margin-bottom: 2rem;">Faça upload de
                múltiplos móveis de uma vez.</p>
              <form id="csv-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="input-group">
                  <label for="csv-file">Arquivo CSV</label>
                  <input type="file" id="csv-file" accept=".csv" required style="border: none; padding: 0;" />
                </div>
                <button type="submit" class="btn btn-dark">Processar Arquivo</button>
              </form>
            </div>

          </div>
        </div>

        <div style="margin-top: 2rem;">
          <h3 style="font-family: var(--font-secondary); font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 400;">
            Profissionais Cadastrados</h3>
          <div class="table-wrap">
            <table class="admin-table architects-admin-table">
              <thead>
                <tr>
                  <th>Profissional</th>
                  <th>E-mail</th>
                  <th>CAU/ABD</th>
                  <th>Instagram</th>
                  <th>Status</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="architects-table">
              </tbody>
            </table>
          </div>
        </div>

        <div style="margin-top: 4rem;">
          <h3 style="font-family: var(--font-secondary); font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 400;">
            Acervo Atual</h3>
          <div style="overflow-x: auto;">
            <table style="width: 100%; text-align: left; border-collapse: collapse;">
              <thead>
                <tr style="border-bottom: 1px solid var(--color-border);">
                  <th style="padding: 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">Peça
                  </th>
                  <th style="padding: 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">Marca
                  </th>
                  <th style="padding: 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">
                    Categoria</th>
                  <th style="padding: 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">
                    Dimensões</th>
                  <th style="padding: 1rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;">Ação
                  </th>
                </tr>
              </thead>
              <tbody id="admin-products-table">
              </tbody>
            </table>
          </div>
          <div id="pagination-controls" class="pagination-container">
          </div>
        </div>
      </section>

      <section id="modulo-blog" style="display: none; margin-top: 3rem;">
        <div style="display: grid; grid-template-columns: 1fr; gap: 4rem;">
          <div style="background: #F9F9F9; padding: 3rem; border: 1px solid var(--color-border); max-width: 900px;">
            <h3 style="font-family: var(--font-secondary); font-size: 1.5rem; margin-bottom: 2rem; font-weight: 400;">
              Escrever
              Novo Artigo</h3>

            <div style="display: flex; flex-direction: column; gap: 1.5rem;">

              <div class="admin-field-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
                <div class="input-group">
                  <label for="post-title">Título do Artigo</label>
                  <input type="text" id="post-title" placeholder="Ex: Tendências de Design para 2026">
                </div>
                <div class="input-group">
                  <label for="post-author">Autor</label>
                  <input type="text" id="post-author" placeholder="Nome do autor">
                </div>
              </div>

              <div class="admin-field-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
                <div class="input-group">
                  <label for="post-slug">URL Amigável</label>
                  <input type="text" id="post-slug" placeholder="ex: tendencias-de-design-para-2026">
                </div>
                <div class="input-group">
                  <label for="post-status">Status de Publicação</label>
                  <select id="post-status"
                    style="width: 100%; border: none; border-bottom: 1px solid var(--color-border); background: transparent; font-family: var(--font-primary); font-size: 0.85rem; padding: 0.5rem 0;">
                    <option value="true">Publicado</option>
                    <option value="false">Rascunho (Oculto)</option>
                  </select>
                </div>
              </div>

              <div class="input-group">
                <label for="post-cover-file">Imagem de Capa (Upload ou Link)</label>
                <div class="admin-upload-row" style="display: flex; gap: 1rem; align-items: flex-end;">
                  <div style="flex: 1;">
                    <input type="file" id="post-cover-file" accept="image/*" />
                  </div>
                  <span style="font-size: 0.8rem; color: #777; margin-bottom: 0.8rem;">OU</span>
                  <div style="flex: 2;">
                    <input type="url" id="post-cover" placeholder="Link da imagem">
                  </div>
                </div>
                <small id="upload-status" style="display: none; font-size: 0.75rem; margin-top: 0.5rem;"></small>
              </div>

              <div class="input-group editor-wrapper" style="margin-bottom: 1rem;">
                <label for="editor">Conteúdo</label>
                <div id="editor" style="height: 400px; background: #fff;"></div>
              </div>

              <button id="btn-publish" class="btn btn-dark" style="margin-top: 1rem;">Publicar Artigo</button>
            </div>
          </div>
        </div>
      </section>

    </section>
  </main>
</body>

</html>

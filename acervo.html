<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Curadoria de mobiliário atemporal da HS, com peças exclusivas, acabamentos refinados e soluções para ambientes com identidade." />
  <title>HS | Alta Decoração</title>
  <link rel="stylesheet" href="./global.css" />
  <link rel="stylesheet" href="./acervo.css" />
  <script type="module" src="./acervo.js" defer></script>
</head>

<body data-page="acervo">

  <div data-site-header></div>

  <section class="hero">
    <div class="hero-content">
      <h2>Conheça a nossa curadoria de mobiliário<br>atemporal para se inspirar.</h2>
      <a href="#acervo" class="btn">Explorar Coleção</a>
    </div>
  </section>

  <main id="acervo" class="container" style="padding-top: 4rem; padding-bottom: 8rem;">

    <!-- Cabeçalho Minimalista da Página -->
    <div
      style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem; margin-bottom: 3rem;">
      <h1 style="font-family: var(--font-secondary); font-size: 2rem; font-weight: 400; margin: 0;">Coleção</h1>
      <span
        style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--color-text-light);">Design
        Autoral</span>
    </div>

    <!-- Status -->
    <div id="public-status"
      style="text-align:center; font-size: 0.8rem; letter-spacing: 2px; color: var(--color-text-light); margin-bottom: 2rem;">
    </div>

    <!-- Layout Dividido: Filtros na Esquerda (Desktop) e Grade na Direita -->
    <div class="acervo-layout">

      <!-- BARRA DE FILTROS (Estilo Sidebar Minimalista) -->
      <aside class="filter-sidebar">
        <div class="filter-group-vertical">
          <label for="search-input">Buscar Peça</label>
          <input type="text" id="search-input" placeholder="Ex: Sofá Float..." autocomplete="off" />
        </div>

        <div class="filter-group-vertical">
          <label for="filter-category">Categoria</label>
          <select id="filter-category">
            <option value="">Todas as Categorias</option>
            <!-- JS injeta aqui -->
          </select>
        </div>
      </aside>

      <!-- GRADE DE PRODUTOS -->
      <div id="public-products" class="sierra-grid" aria-live="polite">
        <!-- JS injeta os produtos aqui -->
      </div>

    </div>

    <div id="pagination-container" class="pagination"></div>

    <section class="materiality-section" style="margin-top: 8rem; margin-bottom: 6rem;">
      <div class="container">

        <div class="materiality-header" style="text-align: center; margin-bottom: 4rem;">
          <span
            style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: #C68E58; display: block; margin-bottom: 1rem;">Acabamentos</span>
          <h2
            style="font-family: var(--font-secondary); font-size: 2.5rem; font-weight: 400; color: var(--color-text);">
            Materialidade</h2>
          <p style="color: var(--color-text-light); max-width: 600px; margin: 1rem auto 0; line-height: 1.6;">
            Nossos móveis ganham vida através de matérias-primas selecionadas. 
            Conheça algumas texturas e tons que compõem o nosso acervo autoral.
          </p>
        </div>

        <nav id="texture-category-menu" class="texture-category-menu" aria-label="Tipos de textura"></nav>

        <div id="textures-grid" class="textures-container" aria-live="polite"></div>

        <div id="texture-pagination" class="pagination texture-pagination" aria-label="Paginação das texturas"></div>

      </div>
    </section>

  </main>


  <div data-site-footer></div>

</body>

</html>

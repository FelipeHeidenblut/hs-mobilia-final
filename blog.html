<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editorial HS sobre design, mobiliário, arquitetura e diferentes formas de viver.">
    <title>Blog | HS</title>

    <link rel="stylesheet" href="./global.css">
